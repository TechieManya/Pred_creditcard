name: CI – Fraud Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test training pipeline (CI synthetic test)
        run: python train.py --algorithm lightgbm --n_estimators 50 --sample_size 1000 --allow-synthetic

      - name: Run tests
        run: pytest tests/ -v
